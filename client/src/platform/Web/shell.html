<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mu Online</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* El canvas ocupa siempre toda la página; el juego dibuja a su resolución
     (Opciones, o la de la página) y el navegador lo estira.  SDL escala el
     mouse con la relación entre las dos (canvas con tamaño por CSS). */
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
            font: 14px sans-serif; color: #c8b27a; pointer-events: none; }
  #fullscreen { position: fixed; right: 8px; top: 8px; z-index: 2; padding: 4px 10px;
                font: 12px sans-serif; color: #c8b27a; background: rgba(0,0,0,.6);
                border: 1px solid #5a4a2a; border-radius: 3px; cursor: pointer; opacity: .55; }
  #fullscreen:hover { opacity: 1; }
  :fullscreen #fullscreen, body.menu #fullscreen { display: none; }

  /* Menú previo: opciones mientras el juego y los datos bajan de fondo. */
  #menu { position: fixed; inset: 0; z-index: 3; display: none; overflow: auto;
          background: radial-gradient(ellipse at center, #1c140a 0%, #000 75%);
          font: 14px sans-serif; color: #d8c898; }
  body.menu #menu { display: flex; align-items: center; justify-content: center; }
  #menu .panel { width: min(520px, 92vw); margin: 16px; padding: 20px 24px;
                 background: rgba(10, 8, 4, .9); border: 1px solid #6b5630; border-radius: 4px;
                 box-shadow: 0 0 24px rgba(0,0,0,.8); }
  #menu h1 { margin: 0 0 4px; font: 600 24px serif; color: #f0d890; text-align: center; letter-spacing: 1px; }
  #menu .sub { margin: 0 0 16px; text-align: center; color: #9a8a60; font-size: 12px; }
  #menu h2 { margin: 14px 0 6px; font: 600 12px sans-serif; color: #b09a60; text-transform: uppercase;
             letter-spacing: 1px; border-bottom: 1px solid #3a2e18; padding-bottom: 3px; }
  #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0; }
  #menu select { min-width: 170px; padding: 3px 6px; font: 13px sans-serif; color: #e8d8a8;
                 background: #1a140a; border: 1px solid #5a4a2a; border-radius: 3px; }
  #menu input[type=checkbox] { width: 18px; height: 18px; accent-color: #b8902a; }
  #menu .progress { height: 6px; margin: 16px 0 6px; background: #1a140a; border: 1px solid #3a2e18; border-radius: 3px; overflow: hidden; }
  #menu .progress div { height: 100%; width: 0; background: linear-gradient(90deg, #6b5020, #d8a840); transition: width .3s; }
  #menu .note { min-height: 16px; font-size: 12px; color: #9a8a60; text-align: center; }
  #play { display: block; width: 100%; margin-top: 12px; padding: 10px; font: 600 16px sans-serif;
          color: #1a1206; background: linear-gradient(#e8c060, #a87a20); border: 1px solid #f0d890;
          border-radius: 3px; cursor: pointer; }
  #play:disabled { color: #6a5a3a; background: #2a2214; border-color: #4a3a20; cursor: default; }
</style>
</head>
<body class="menu">
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status"></div>
<button id="fullscreen" title="Pantalla completa: el juego recibe todas las teclas (Ctrl+número, Ctrl+W...)">Pantalla completa</button>
<div id="menu">
  <div class="panel">
    <h1>MU Online</h1>
    <p class="sub">Elegí las opciones mientras se prepara el juego</p>
    <div id="options"></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="note" id="note">Cargando…</div>
    <button id="play" disabled>Jugar</button>
  </div>
</div>
<script>
// Táctil o no: lo decide la página una vez y se lo pasa al cliente (--mobile).
// No alcanza con el user agent: una notebook táctil o una tablet con teclado
// engañan; se pide puntero grueso y pantalla táctil.
function isTouchClient() {
  if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
  return window.matchMedia('(pointer: coarse)').matches && navigator.maxTouchPoints > 0;
}

// Raíz del cliente dentro del sistema de archivos del wasm.  Content/ y System/
// se crean como archivos "perezosos": existen en el árbol (las búsquedas y los
// listados los ven) y su contenido se baja recién cuando el juego los abre.
const ROOT = '/mu';
const BASE = new URL('game/', document.baseURI).href;
const CONFIG = ROOT + '/Config.ini', SAVED_CONFIG = ROOT + '/User/Config.ini';

function setStatus(text) { document.getElementById('status').textContent = text || ''; }
function setNote(text) { document.getElementById('note').textContent = text || ''; }

// Pantalla completa.  Fuera de ella el navegador se queda con algunas teclas
// (Ctrl+W cierra la pestaña, Ctrl+1..9 cambian de pestaña, Ctrl+T/N abren otra)
// y el juego no las ve.  En pantalla completa, donde el navegador lo permite
// (Chrome, Edge), Keyboard Lock se las pasa todas al juego; Escape sostenido
// sale.  El tamaño del juego sigue al de la página solo (WebPage.cpp).
// Opciones > Pantalla la pide con muSetFullscreen (WebPage.cpp).
window.muSetFullscreen = async (on) => {
  try {
    if (!on) { if (document.fullscreenElement) await document.exitFullscreen(); return; }
    await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
  } catch (e) {
    console.warn('Pantalla completa: ' + e.message);
  }
  document.getElementById('canvas').focus();
};
document.getElementById('fullscreen').addEventListener('click', () => window.muSetFullscreen(true));
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
});
// Alt solo abre el menú del navegador (Firefox, y Chrome en Windows al soltarlo)
// y le saca el foco al juego.  SDL ya frena F1, F10 y el resto.
for (const type of ['keydown', 'keyup'])
  addEventListener(type, (e) => { if (e.key === 'Alt' && !document.body.classList.contains('menu')) e.preventDefault(); }, true);
// Antes de cerrar la pestaña con el juego andando, el navegador pregunta.
addEventListener('beforeunload', (e) => {
  if (document.body.classList.contains('menu')) return;
  e.preventDefault(); e.returnValue = '';
});

// Red: el cliente abre sockets TCP comunes y Emscripten los convierte en
// WebSocket a ws://<host>:<puerto>/.  Acá se mandan todos al puente de mu-web
// (/play/ws, web/lib/play-gateway.js), que sólo deja pasar los puertos del
// server.  ?gw=<url> usa otro puente (pruebas).
const GATEWAY = new URLSearchParams(location.search).get('gw')
  || (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/play/ws';
{
  const NativeWebSocket = window.WebSocket;
  window.WebSocket = class extends NativeWebSocket {
    constructor(url, protocols) {
      const port = new URL(url).port;
      super(GATEWAY + (GATEWAY.includes('?') ? '&' : '?') + 'port=' + encodeURIComponent(port), protocols);
    }
  };
}

// ── Opciones ────────────────────────────────────────────────────────────────
// Las mismas claves de Config.ini que lee el cliente (app/config/OptionTable.h).
// Lo que el jugador cambia acá o en el juego queda en Config.ini, que se guarda
// en User/ (IndexedDB) y vale la próxima vez.  En el navegador la resolución es
// la de dibujo: el alto elegido con la proporción de la página
// (WebPage::Size); "Automática" usa la de la página (índice 8 = 1440, más alto
// que cualquier página común).
const OPTIONS = [
  { title: 'Pantalla' },
  { label: 'Resolución', section: 'Window', key: 'Resolution', def: 8, choices: [
    [8, 'Automática (la de la página)'], [0, '480 de alto'], [1, '600 de alto'], [4, '720 de alto'],
    [2, '768 de alto'], [6, '900 de alto'], [7, '1080 de alto']] },
  { label: 'Pantalla completa al entrar', local: 'mu-fullscreen', def: 0, check: true },
  { label: 'Límite de FPS', section: 'Window', key: 'FpsLimit', def: 60, choices: [
    [30, '30'], [60, '60'], [120, '120'], [144, '144'], [0, 'Sin límite']] },
  { title: 'Gráficos' },
  { label: 'Calidad de texturas', section: 'Window', key: 'TextureQuality', def: 0, choices: [
    [0, 'Original'], [1, 'Mipmaps'], [2, 'Mipmaps + bicúbico']] },
  { label: 'Texturas HD', section: 'Window', key: 'HDTextures', def: 0, check: true },
  { label: 'Antialiasing', section: 'Window', key: 'Antialiasing', def: 0, choices: [
    [0, 'No'], [1, 'FXAA'], [2, 'MSAA 4x'], [3, 'MSAA 4x + FXAA']] },
  { label: 'Sombras', section: 'Window', key: 'Shadows', def: 0, choices: [
    [0, 'No'], [1, '1'], [2, '2']] },
  { label: 'Luces dinámicas', section: 'Window', key: 'DynamicLights', def: 1, choices: [
    [0, 'No'], [1, 'Normales'], [2, 'Altas']] },
  { label: 'Brillo (bloom)', section: 'Window', key: 'Bloom', def: 1, choices: [
    [0, 'No'], [1, 'Normal'], [2, 'Alto']] },
  { label: 'Distancia de dibujado', section: 'Window', key: 'DrawDistance', def: 0, choices: [
    [0, 'Normal'], [1, 'x1.5'], [2, 'x2'], [3, 'x3']] },
  { label: 'Niebla de profundidad', section: 'Window', key: 'DepthFog', def: 0, check: true },
  { title: 'Sonido' },
  { label: 'Sonido', section: 'Sound', key: 'EnableSound', def: 1, check: true },
  { label: 'Música', section: 'Sound', key: 'EnableMusic', def: 1, check: true },
];

// INI mínimo: conserva líneas, comentarios y claves que el menú no conoce.
function iniGet(text, section, key) {
  let current = '';
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (line.startsWith('[') && line.endsWith(']')) { current = line.slice(1, -1).trim().toLowerCase(); continue; }
    const eq = line.indexOf('=');
    if (eq > 0 && current === section.toLowerCase() && line.slice(0, eq).trim().toLowerCase() === key.toLowerCase())
      return line.slice(eq + 1).trim();
  }
  return null;
}
function iniSet(text, section, key, value) {
  const lines = text ? text.replace(/\r/g, '').split('\n') : [];
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  let current = '', sectionEnd = -1;
  for (let i = 0; i < lines.length; ++i) {
    const line = lines[i].trim();
    if (line.startsWith('[') && line.endsWith(']')) { current = line.slice(1, -1).trim().toLowerCase(); continue; }
    if (current !== section.toLowerCase()) continue;
    sectionEnd = i;
    const eq = line.indexOf('=');
    if (eq > 0 && line.slice(0, eq).trim().toLowerCase() === key.toLowerCase()) {
      lines[i] = key + '=' + value;
      return lines.join('\r\n') + '\r\n';
    }
  }
  if (sectionEnd < 0) {
    // La sección puede existir vacía.
    const at = lines.findIndex((l) => l.trim().toLowerCase() === '[' + section.toLowerCase() + ']');
    if (at >= 0) sectionEnd = at;
    else { lines.push('[' + section + ']'); sectionEnd = lines.length - 1; }
  }
  lines.splice(sectionEnd + 1, 0, key + '=' + value);
  return lines.join('\r\n') + '\r\n';
}

function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

function buildMenu(configText) {
  const box = document.getElementById('options');
  box.textContent = '';
  for (const option of OPTIONS) {
    if (option.title) {
      const h = document.createElement('h2'); h.textContent = option.title; box.appendChild(h); continue;
    }
    const saved = option.local ? storageGet(option.local) : iniGet(configText, option.section, option.key);
    let value = saved === null || saved === '' || isNaN(Number(saved)) ? option.def : Number(saved);
    const row = document.createElement('label'); row.className = 'row';
    const name = document.createElement('span'); name.textContent = option.label; row.appendChild(name);
    let input;
    if (option.check) {
      input = document.createElement('input'); input.type = 'checkbox'; input.checked = value !== 0;
    } else {
      input = document.createElement('select');
      // Un valor del INI que no está en la lista se conserva como opción.
      if (!option.choices.some(([v]) => v === value)) option.choices = option.choices.concat([[value, String(value)]]);
      for (const [v, text] of option.choices) {
        const o = document.createElement('option'); o.value = v; o.textContent = text; o.selected = v === value;
        input.appendChild(o);
      }
    }
    option.input = input;
    row.appendChild(input);
    box.appendChild(row);
  }
}

function readMenu(configText) {
  for (const option of OPTIONS) {
    if (!option.input) continue;
    const value = option.check ? (option.input.checked ? 1 : 0) : Number(option.input.value);
    if (option.local) storageSet(option.local, String(value));
    else configText = iniSet(configText, option.section, option.key, value);
  }
  return configText;
}

// ── Descargas ───────────────────────────────────────────────────────────────
// Module.muFetch(ruta) baja un archivo perezoso una sola vez aunque lo pidan el
// juego (WebFiles.cpp) y la descarga de fondo a la vez.  files.txt marca con
// una tercera columna "b" los que el cliente abre hasta la pantalla de login
// (tools/web/boot-files.txt): esos se bajan mientras el jugador está en el menú.
let bootTotal = 0, bootDone = 0;
function showProgress() {
  document.getElementById('bar').style.width = (bootTotal ? 100 * bootDone / bootTotal : 0) + '%';
}

var Module = {
  canvas: document.getElementById('canvas'),
  arguments: isTouchClient() ? ['--mobile'] : [],
  // El juego arranca con el botón Jugar (callMain).
  noInitialRun: true,
  print: (t) => console.log(t),
  printErr: (t) => console.warn(t),
  setStatus: (t) => setNote(t),
  preRun: [function (M) {
    const FS = M.FS, ENV = M.ENV, IDBFS = M.IDBFS;
    const addRunDependency = M.addRunDependency, removeRunDependency = M.removeRunDependency;
    ENV.MU_CLIENT_ROOT = ROOT;
    FS.mkdirTree(ROOT + '/User');
    // User/ (debug.log, caché de claves, Config.ini) persiste en IndexedDB.
    FS.mount(IDBFS, {}, ROOT + '/User');
    addRunDependency('mu-files');

    const pending = new Map(), inflight = new Map();
    M.muPending = pending;
    M.muRequested = [];   // lo que pidió el juego, en orden (para boot-files.txt)
    M.muFetch = (path, fromGame) => {
      if (fromGame) M.muRequested.push(path.substring(ROOT.length + 1));
      if (inflight.has(path)) return inflight.get(path);
      const url = pending.get(path);
      if (!url) return Promise.resolve(true);
      const job = fetch(url)
        .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then((data) => { FS.writeFile(path, new Uint8Array(data)); pending.delete(path); return true; })
        .catch((e) => { console.warn('No se pudo bajar ' + url + ': ' + e.message); return false; })
        .finally(() => inflight.delete(path));
      inflight.set(path, job);
      return job;
    };

    FS.syncfs(true, () => {
      let configText = '';
      try { configText = new TextDecoder().decode(FS.readFile(SAVED_CONFIG)); } catch (e) {}
      buildMenu(configText);
      M.muConfigText = configText;
      fetch(BASE + 'files.txt', { cache: 'no-cache' })
        .then((r) => { if (!r.ok) throw new Error('files.txt ' + r.status); return r.text(); })
        .then(async (text) => {
          // Cada archivo nace vacío y anotado en pending; el cliente lo baja al
          // abrirlo.  Los de texto chicos (.toml, .txt, .ini) se bajan ya, todos
          // juntos: el cliente los lee al arrancar y de a uno serían cientos de
          // idas y vueltas.
          const eager = [], boot = [];
          for (const line of text.split('\n')) {
            const [path, size, flag] = line.split('\t');
            if (!path) continue;
            const slash = path.lastIndexOf('/');
            FS.mkdirTree(ROOT + '/' + path.substring(0, slash));
            const full = ROOT + '/' + path;
            FS.writeFile(full, new Uint8Array(0));
            pending.set(full, BASE + path.split('/').map(encodeURIComponent).join('/'));
            if (/\.(toml|txt|ini)$/i.test(path) && Number(size) < 256 * 1024) eager.push(full);
            else if (flag === 'b') boot.push(full);
          }
          bootTotal = eager.length + boot.length;
          const worker = (list) => async () => {
            while (list.length) { await M.muFetch(list.shift()); ++bootDone; showProgress(); }
          };
          setNote('Cargando datos…');
          await Promise.all(Array.from({ length: 8 }, worker(eager)));
          removeRunDependency('mu-files');
          // Lo del login sigue de fondo, aunque el jugador ya haya entrado.
          Promise.all(Array.from({ length: 4 }, worker(boot))).then(() => {
            if (!M.muStarted) setNote('Listo');
          });
        })
        .catch((e) => setNote('No se pudo cargar la lista de archivos: ' + e.message));
    });

    // El cliente escribe Config.ini en la raíz (al cambiar una opción): cada
    // segundo, si cambió, se copia a User/ y se guarda.  Las opciones, también
    // las que piden reiniciar, valen al recargar la página.
    let lastConfig = null;
    setInterval(() => {
      if (!M.muStarted) return;
      let text;
      try { text = new TextDecoder().decode(FS.readFile(CONFIG)); } catch (e) { return; }
      if (text === lastConfig) return;
      lastConfig = text;
      FS.writeFile(SAVED_CONFIG, text);
      FS.syncfs(false, () => {});
    }, 1000);
    // debug.log y el resto de User/, cada tanto.
    setInterval(() => { if (M.muStarted) FS.syncfs(false, () => {}); }, 15000);
  }],
  onRuntimeInitialized() {
    const play = document.getElementById('play');
    play.disabled = false;
    if (bootDone < bootTotal) setNote('Bajando datos de fondo; ya podés jugar');
    else setNote('Listo');
  },
};

document.getElementById('play').addEventListener('click', () => {
  const M = Module, FS = M.FS;
  const configText = readMenu(M.muConfigText || '');
  FS.writeFile(CONFIG, configText);
  FS.writeFile(SAVED_CONFIG, configText);
  FS.syncfs(false, () => {});
  // El click del jugador habilita pedir la pantalla completa.
  if (storageGet('mu-fullscreen') === '1') window.muSetFullscreen(true);
  document.body.classList.remove('menu');
  document.getElementById('canvas').focus();
  M.muStarted = true;
  M.callMain(M.arguments);
});
</script>
<!-- {{{ SCRIPT }}} : se carga abajo, según lo que soporte el navegador -->
<script>
// JSPI (WebAssembly.Suspending) deja pausar el juego sin reescribir el wasm:
// el frame cuesta como sin pausas.  Sin él, el build con ASYNCIFY.
{
  const script = document.createElement('script');
  // ?asyncify fuerza el de respaldo (pruebas).
  const jspi = ('Suspending' in WebAssembly) && !new URLSearchParams(location.search).has('asyncify');
  script.src = jspi ? 'main.js' : 'main-asyncify.js';
  script.async = true;
  document.body.appendChild(script);
}
</script>
</body>
</html>
