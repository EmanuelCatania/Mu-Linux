name: Launcher
# El launcher (SDL3) y el transporte HTTP del actualizador (libcurl).
# Se compila solo (client/src/launcher), en Windows con Schannel y en Linux con
# el OpenSSL de la distribución, y corre sus pruebas contra un server HTTP
# local.  Las del núcleo sin red (mu_update_test) las corre client.yml.
# El ejecutable queda como artefacto del run.
on:
  pull_request:
    paths:
      - "client/src/launcher/**"
      - "client/src/update/**"
      - "client/cmake/MuUpdate.cmake"
      - "client/cmake/MuUpdateHttp.cmake"
      - "client/tools/mu-patch/**"
      - "client/tests/UpdateHttp.cpp"
      - "client/cmake/MuSDL3.cmake"
      - "client/cmake/MuEmbedFile.cmake"
      - "client/lib/stb/**"
      - ".github/workflows/launcher.yml"
  push:
    branches: [ "release/*", "main" ]
    paths:
      - "client/src/launcher/**"
      - "client/src/update/**"
      - "client/cmake/MuUpdate.cmake"
      - "client/cmake/MuUpdateHttp.cmake"
      - "client/tests/UpdateHttp.cpp"
      - "client/cmake/MuSDL3.cmake"
      - "client/cmake/MuEmbedFile.cmake"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2022 ]
    steps:
      - uses: actions/checkout@v5
      - name: Dependencias de sistema Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev libx11-xcb-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libegl-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols pkg-config
      - name: Compilar
        shell: bash
        run: |
          cmake -S client/src/launcher -B build/launcher -DCMAKE_BUILD_TYPE=Release
          cmake --build build/launcher --config Release --parallel 4
      - name: Pruebas
        shell: bash
        run: ctest --test-dir build/launcher -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: |
            build/launcher/launcher
            build/launcher/Release/launcher.exe
          if-no-files-found: ignore
      # El artefacto lleva el tema por defecto; los demás sólo se compilan, para
      # que un cambio en ThemeSpec.h no rompa un tema sin que se note.
      - name: Compilar los demás temas
        shell: bash
        run: |
          for t in client/src/launcher/themes/*/Theme.cpp; do
            name=$(basename "$(dirname "$t")")
            [ "$name" = WebzenOldSchoolV1 ] && continue
            echo "::group::$name"
            cmake -S client/src/launcher -B build/launcher -DMU_LAUNCHER_THEME="$name"
            cmake --build build/launcher --config Release --target launcher --parallel 4
            echo "::endgroup::"
          done
